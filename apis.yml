description: Regrello is an AI operating system for manufacturing and supply chain operations, giving
  teams that are stuck in email and stifled by decades-old ERPs an agentic AI platform to accelerate
  innovation and productivity. Its product, Agentforce Operations, orchestrates enterprise manufacturing
  and supply chain workflows with generative AI. Regrello was acquired by Salesforce and is backed by
  a16z and Bloomberg Beta. This profile currently exposes no public API, developer portal, or
  documentation surface; it is tracked in the API Evangelist network for its identity, security posture,
  and published compliance program.
